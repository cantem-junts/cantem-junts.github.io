# Cada canvi a main (també els que desa l'editor) passa les proves, refà
# l'índex de cançons i publica la web a GitHub Pages.
name: Publica
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# Dues feines: si es puja i es publica a la mateixa, de vegades GitHub encara
# no troba el paquet que s'acaba de pujar (actions/deploy-pages#451).
jobs:
  construeix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/index.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  publica:
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v4
